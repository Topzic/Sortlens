name: Build Windows installer

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reject local credential files before packaging
        shell: pwsh
        run: |
          if (Test-Path backend\.env) { throw 'backend/.env must not be in the build.' }
          if (Test-Path .env) { throw '.env must not be in the build.' }
          if (Test-Path ios-app) { throw 'The iOS app must not be published.' }

      - name: Build Sortlens
        run: python build.py

      - name: Download installer prerequisites
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer\download_prerequisites.ps1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem -Path 'C:\Program Files (x86)','C:\Program Files','C:\ProgramData\chocolatey' -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw 'Inno Setup compiler (ISCC.exe) was not found.' }
          Write-Host "Using $iscc"
          & $iscc installer\sortlens_installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }

      - name: Zip the installer
        shell: pwsh
        run: |
          $exe = 'installer\output\SortlensSetup-0.9.0.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          Compress-Archive -Path $exe -DestinationPath installer\output\SortlensSetup-0.9.0.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SortlensSetup-0.9.0
          path: installer/output/SortlensSetup-0.9.0.zip
          if-no-files-found: error
